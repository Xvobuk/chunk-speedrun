name: Update leaderboard
on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  push:
    paths: [moderation.json, scripts/update_leaderboard.py, .github/workflows/leaderboard.yml]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: leaderboard-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rebuild tables from immutable submissions and moderation file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_leaderboard.py
      - name: Save leaderboard
        run: |
          git config user.name "ChunkSpeedrun leaderboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update challenge results"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
